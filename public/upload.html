<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Upload</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="container" id="app">
      <div class="panel chrome titlebar">
        <div>
        <h1>Upload files</h1>
        <p id="nsLabel"></p>
        </div>
      </div>

      <div class="panel">
        <div class="small" id="authStatus" hidden></div>
        <p class="small" id="authActions" hidden>
          <a id="loginLink" href="/auth/google/login">Sign in with Google</a>
        </p>
        <div class="dropzone" id="dropzone">
          <h2>Drag and drop files or folders</h2>
          <p>or choose files from your device.</p>
          <input id="fileInput" type="file" multiple />
        </div>
        <p class="small" id="uploadHint"></p>
      </div>

      <div class="panel chrome">
        <h2>Files</h2>
        <div class="file-list" id="fileList"></div>
      </div>
    </div>

    <div class="toast-wrap" id="toasts"></div>
    <script type="module" src="/upload.js"></script>
  </body>
</html>
